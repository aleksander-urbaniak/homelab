---
- name: "Quick Password Reset (Root & Example)"
  hosts: all
  become: true
  gather_facts: true

  vars:
    pwd_chars: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()"
    pwd_length: 32

  tasks:
    # 1. Ensure passlib is present on controller
    - name: Install passlib on controller
      pip:
        name: passlib
      delegate_to: localhost
      run_once: true
      become: false
      ignore_errors: true

    # 2. Generate Passwords
    - name: Generate Random Passwords
      set_fact:
        example_pass: "{{ lookup('password', '/dev/null', length=pwd_length, chars=pwd_chars) }}"
        root_pass: "{{ lookup('password', '/dev/null', length=pwd_length, chars=pwd_chars) }}"

    # 3. DISPLAY PASSWORDS IN LOGS
    - name: "!!! NEW PASSWORDS GENERATED !!!"
      debug:
        msg:
          - "=============================================="
          - " HOST: {{ inventory_hostname }}"
          - "----------------------------------------------"
          - " USER: example"
          - " PASS: {{ example_pass }}"
          - "----------------------------------------------"
          - " USER: root"
          - " PASS: {{ root_pass }}"
          - "=============================================="

    # 4. Apply Example Password
    - name: Update/Create user 'example'
      user:
        name: example
        password: "{{ example_pass | password_hash('sha512') }}"
        state: present
        shell: /bin/bash
        groups: "{{ 'wheel' if ansible_os_family == 'RedHat' else 'sudo' }}"
        append: yes
      ignore_errors: true

    # 5. Apply Root Password
    - name: Update root password
      user:
        name: root
        password: "{{ root_pass | password_hash('sha512') }}"

    # 6. Create .ssh dir for Example (Just in case)
    - name: Create .ssh directory for example
      file:
        path: /home/example/.ssh
        state: directory
        owner: example
        group: example
        mode: '0700'
      ignore_errors: true