name: Auto-Approve Renovate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write

jobs:
  approve-renovate:
    runs-on: ubuntu-latest
    # Only run if the PR creator is Renovate Bot
    if: github.actor == 'renovate[bot]'
    steps:
      - name: Approve PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr review ${{ github.event.pull_request.number }} --approve -R ${{ github.repository }}
