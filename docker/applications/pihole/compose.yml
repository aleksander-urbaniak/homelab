services:
  pihole:
    container_name: pihole
    image: pihole/pihole:2026.02.0
    restart: unless-stopped
    hostname: pihole
    volumes:
      - /mnt/docker/pihole/etc-pihole:/etc/pihole
      - /mnt/docker/pihole/etc-dnsmasq.d:/etc/dnsmasq.d
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "${PIHOLE_WEB_PORT}:80/tcp"
    cap_add:
      - NET_ADMIN
