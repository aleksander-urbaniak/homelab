services:
  wazuh.indexer:
    image: wazuh/wazuh-indexer:4.14.7
    container_name: wazuh.indexer
    hostname: wazuh.indexer
    restart: always
    ports:
      - "9200:9200"
    environment:
      OPENSEARCH_JAVA_OPTS: "${WAZUH_INDEXER_JAVA_OPTS}"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - /mnt/docker/wazuh/wazuh-indexer-data:/var/lib/wazuh-indexer
      - /mnt/docker/wazuh/config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-indexer/config/certs/root-ca.pem
      - /mnt/docker/wazuh/config/wazuh_indexer_ssl_certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.pem
      - /mnt/docker/wazuh/config/wazuh_indexer_ssl_certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.key
      - /mnt/docker/wazuh/config/wazuh_indexer_ssl_certs/admin.pem:/usr/share/wazuh-indexer/config/certs/admin.pem
      - /mnt/docker/wazuh/config/wazuh_indexer_ssl_certs/admin-key.pem:/usr/share/wazuh-indexer/config/certs/admin-key.pem
      - /mnt/docker/wazuh/config/wazuh_indexer/wazuh.indexer.yml:/usr/share/wazuh-indexer/config/opensearch.yml
      - /mnt/docker/wazuh/config/wazuh_indexer/internal_users.yml:/usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml

  wazuh.manager:
    image: wazuh/wazuh-manager:4.14.6
    container_name: wazuh.manager
    hostname: wazuh.manager
    restart: always
    depends_on:
      - wazuh.indexer
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 655360
        hard: 655360
    ports:
      - "1514:1514"
      - "1515:1515"
      - "514:514/udp"
      - "55000:55000"
    environment:
      - INDEXER_URL=https://wazuh.indexer:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${WAZUH_INDEXER_PASSWORD}
      - FILEBEAT_SSL_VERIFICATION_MODE=full
      - SSL_CERTIFICATE_AUTHORITIES=/etc/ssl/root-ca.pem
      - SSL_CERTIFICATE=/etc/ssl/filebeat.pem
      - SSL_KEY=/etc/ssl/filebeat.key
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=${WAZUH_API_PASSWORD}
    volumes:
      - /mnt/docker/wazuh/wazuh_ruleset:/var/ossec/ruleset
      - /mnt/docker/wazuh/wazuh_api_configuration:/var/ossec/api/configuration
      - /mnt/docker/wazuh/wazuh_etc:/var/ossec/etc
      - /mnt/docker/wazuh/config/wazuh_cluster/wazuh_manager.conf:/var/ossec/etc/ossec.conf:ro
      - /mnt/docker/wazuh/wazuh_logs:/var/ossec/logs
      - /mnt/docker/wazuh/wazuh_queue:/var/ossec/queue
      - /mnt/docker/wazuh/wazuh_var_multigroups:/var/ossec/var/multigroups
      - /mnt/docker/wazuh/wazuh_integrations:/var/ossec/integrations
      - /mnt/docker/wazuh/wazuh_active_response:/var/ossec/active-response/bin
      - /mnt/docker/wazuh/wazuh_agentless:/var/ossec/agentless
      - /mnt/docker/wazuh/wazuh_wodles:/var/ossec/wodles
      - /mnt/docker/wazuh/filebeat_etc:/etc/filebeat
      - /mnt/docker/wazuh/filebeat_var:/var/lib/filebeat
      - /mnt/docker/wazuh/config/wazuh_indexer_ssl_certs/root-ca-manager.pem:/etc/ssl/root-ca.pem
      - /mnt/docker/wazuh/config/wazuh_indexer_ssl_certs/wazuh.manager.pem:/etc/ssl/filebeat.pem
      - /mnt/docker/wazuh/config/wazuh_indexer_ssl_certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key
      - /mnt/docker/wazuh/config/wazuh_cluster/wazuh_manager.conf:/wazuh-config-mount/etc/ossec.conf:ro

  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:4.14.6
    container_name: wazuh.dashboard
    hostname: wazuh.dashboard
    restart: always
    depends_on:
      - wazuh.indexer
      - wazuh.manager
    ports:
      - "4443:5601"
    environment:
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${WAZUH_INDEXER_PASSWORD}
      - WAZUH_API_URL=https://wazuh.manager
      - DASHBOARD_USERNAME=kibanaserver
      - DASHBOARD_PASSWORD=${WAZUH_DASHBOARD_PASSWORD}
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=${WAZUH_API_PASSWORD}
    volumes:
      - /mnt/docker/wazuh/config/wazuh_indexer_ssl_certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem
      - /mnt/docker/wazuh/config/wazuh_indexer_ssl_certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem
      - /mnt/docker/wazuh/config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem
      - /mnt/docker/wazuh/config/wazuh_dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml
      - /mnt/docker/wazuh/config/wazuh_dashboard/wazuh.yml:/usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml
      - /mnt/docker/wazuh/wazuh-dashboard-config:/usr/share/wazuh-dashboard/data/wazuh/config
      - /mnt/docker/wazuh/wazuh-dashboard-custom:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom

  postfix:
    image: boky/postfix:5.1.0
    container_name: postfix-gmail-relay
    restart: always
    network_mode: host
    environment:
      - RELAYHOST=${POSTFIX_RELAYHOST}
      - RELAYHOST_USERNAME=${POSTFIX_RELAYHOST_USERNAME}
      - RELAYHOST_PASSWORD=${POSTFIX_RELAYHOST_PASSWORD}
      - ALLOWED_SENDER_DOMAINS=${POSTFIX_ALLOWED_SENDER_DOMAINS}
