services:
  flaresolverr:
    image: flaresolverr/flaresolverr:v3.5.0
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=${LOG_LEVEL}
      - TZ=${TZ}
    ports:
      - "8191:8191"
    networks:
      - media
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
    restart: unless-stopped

networks:
  media:
    external: true
    name: media
