apiVersion: v1
kind: Service
metadata:
  name: demo-v1-portfolio
  namespace: traefik-external-services
spec:
  ports:
    - name: http
      port: 3001
      targetPort: 3001
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: demo-v1-portfolio
  namespace: traefik-external-services
  labels:
    kubernetes.io/service-name: demo-v1-portfolio
    endpointslice.kubernetes.io/managed-by: staff
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: 3001
endpoints:
  - addresses:
      - 10.0.1.21
    conditions:
      ready: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: demo-v1-portfolio-security-headers
  namespace: traefik-external-services
spec:
  headers:
    browserXssFilter: false
    contentTypeNosniff: true
    customResponseHeaders:
      Cross-Origin-Opener-Policy: same-origin
      Cross-Origin-Resource-Policy: same-origin
      X-Permitted-Cross-Domain-Policies: none
    forceSTSHeader: true
    frameDeny: true
    permissionsPolicy: "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
    referrerPolicy: strict-origin-when-cross-origin
    stsIncludeSubdomains: true
    stsPreload: true
    stsSeconds: 31536000
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: demo-v1-portfolio-rate-limit
  namespace: traefik-external-services
spec:
  rateLimit:
    average: 30
    burst: 90
    period: 1s
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: demo-v1-portfolio-inflight
  namespace: traefik-external-services
spec:
  inFlightReq:
    amount: 50
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: demo-v1-portfolio-compress
  namespace: traefik-external-services
spec:
  compress: {}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: demo-v1-portfolio-hardening
  namespace: traefik-external-services
spec:
  chain:
    middlewares:
      - name: demo-v1-portfolio-security-headers
      - name: demo-v1-portfolio-rate-limit
      - name: demo-v1-portfolio-inflight
      - name: demo-v1-portfolio-compress
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: demo-v1-portfolio
  namespace: traefik-external-services
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`demo-v1-portfolio.auware.xyz`)
      middlewares:
        - name: demo-v1-portfolio-hardening
      services:
        - kind: Service
          name: demo-v1-portfolio
          port: 3001
          scheme: http
  tls:
    options:
      name: portfolio-modern-tls
