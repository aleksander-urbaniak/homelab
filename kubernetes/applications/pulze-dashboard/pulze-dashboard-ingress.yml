apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pulze-dashboard-ingress
  namespace: pulze-dashboard
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/auth-type: "basic"
    nginx.ingress.kubernetes.io/auth-secret: pulze-dashboard-basic-auth
    nginx.ingress.kubernetes.io/auth-realm: "Authentication Required"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - pulze-dashboard.example.com
      secretName: pulze-dashboard-tls
  rules:
    - host: pulze-dashboard.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pulze-dashboard
                port:
                  number: 3000
