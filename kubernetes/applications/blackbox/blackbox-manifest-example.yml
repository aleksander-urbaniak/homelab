apiVersion: v1
kind: Namespace
metadata:
  name: blackbox
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: blackbox-config
  namespace: blackbox
data:
  blackbox.yml: |
    modules:
      http_ok_relaxed:
        prober: http
        timeout: 10s
        http:
          method: GET
          follow_redirects: true
          preferred_ip_protocol: "ip4"
          enable_http2: true
          valid_http_versions: ["HTTP/1.1", "HTTP/2"]
          valid_status_codes: [200,201,202,204,301,302,308]
          fail_if_ssl: false
          fail_if_not_ssl: false
          headers:
            User-Agent: "Mozilla/5.0 (compatible; Prometheus-Blackbox/1.0; +https://prometheus.io)"

      http_2xx_strict:
        prober: http
        timeout: 10s
        http:
          method: GET
          follow_redirects: true
          preferred_ip_protocol: "ip4"
          enable_http2: true
          valid_http_versions: ["HTTP/1.1", "HTTP/2"]
          valid_status_codes: [200,201,202,204]
          headers:
            User-Agent: "Mozilla/5.0 (compatible; Prometheus-Blackbox/1.0; +https://prometheus.io)"

      http_2xx_insecure:
        prober: http
        timeout: 10s
        http:
          method: GET
          follow_redirects: true
          preferred_ip_protocol: "ip4"
          enable_http2: true
          valid_http_versions: ["HTTP/1.1", "HTTP/2"]
          valid_status_codes: [200,201,202,204,301,302,308]
          tls_config:
            insecure_skip_verify: true
          headers:
            User-Agent: "Mozilla/5.0 (compatible; Prometheus-Blackbox/1.0; +https://prometheus.io)"

      icmp:
        prober: icmp
        timeout: 3s
        icmp:
          preferred_ip_protocol: "ip4"

      tls_connect:
        prober: tcp
        timeout: 10s
        tcp:
          tls: true
          tls_config:
            insecure_skip_verify: true
          preferred_ip_protocol: "ip4"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackbox-exporter
  namespace: blackbox
  labels:
    app: blackbox-exporter
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: blackbox-exporter
  template:
    metadata:
      labels:
        app: blackbox-exporter
    spec:
      nodeSelector:
        node-role.kubernetes.io/worker: ""
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: blackbox-exporter
          image: quay.io/prometheus/blackbox-exporter:v0.28.0
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/config/blackbox.yml
          ports:
            - name: http
              containerPort: 9115
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: config-cm
              mountPath: /config
              readOnly: true
      volumes:
        - name: config-cm
          configMap:
            name: blackbox-config
---
apiVersion: v1
kind: Service
metadata:
  name: blackbox-exporter
  namespace: blackbox
spec:
  type: ClusterIP
  selector:
    app: blackbox-exporter
  ports:
    - name: http
      port: 9115
      targetPort: 9115
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: blackbox-ingress
  namespace: blackbox
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/auth-type: "basic"
    nginx.ingress.kubernetes.io/auth-secret: blackbox-basic-auth
    nginx.ingress.kubernetes.io/auth-realm: "Authentication Required"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - blackbox.example.com
      secretName: blackbox-tls
  rules:
    - host: blackbox.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: blackbox-exporter
                port:
                  number: 9115
