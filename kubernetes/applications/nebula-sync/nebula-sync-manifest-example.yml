apiVersion: v1
kind: Namespace
metadata:
  name: nebula-sync
  labels:
    app.kubernetes.io/name: nebula-sync
---
apiVersion: v1
kind: Secret
metadata:
  name: nebula-sync-secret
  namespace: nebula-sync
type: Opaque
stringData:
  PRIMARY: "REPLACE_ME"
  REPLICAS: "REPLACE_ME"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nebula-sync-config
  namespace: nebula-sync
data:
  FULL_SYNC: "true"
  RUN_GRAVITY: "true"
  CRON: "0 * * * *"
  WEBHOOK_CLIENT_SKIP_TLS_VERIFICATION: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nebula-sync
  namespace: nebula-sync
  labels:
    app.kubernetes.io/name: nebula-sync
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nebula-sync
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nebula-sync
    spec:
      nodeSelector:
        node-role.kubernetes.io/worker: ""
      containers:
        - name: nebula-sync
          image: ghcr.io/lovelaze/nebula-sync:v0.11.1
          imagePullPolicy: IfNotPresent
          env:
            - name: PRIMARY
              valueFrom:
                secretKeyRef:
                  name: nebula-sync-secret
                  key: PRIMARY
            - name: REPLICAS
              valueFrom:
                secretKeyRef:
                  name: nebula-sync-secret
                  key: REPLICAS
            - name: FULL_SYNC
              valueFrom:
                configMapKeyRef:
                  name: nebula-sync-config
                  key: FULL_SYNC
            - name: RUN_GRAVITY
              valueFrom:
                configMapKeyRef:
                  name: nebula-sync-config
                  key: RUN_GRAVITY
            - name: CRON
              valueFrom:
                configMapKeyRef:
                  name: nebula-sync-config
                  key: CRON
            - name: WEBHOOK_CLIENT_SKIP_TLS_VERIFICATION
              valueFrom:
                configMapKeyRef:
                  name: nebula-sync-config
                  key: WEBHOOK_CLIENT_SKIP_TLS_VERIFICATION
            - name: CLIENT_SKIP_TLS_VERIFICATION
              value: "true"
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: nebula-sync
  namespace: nebula-sync
  labels:
    app.kubernetes.io/name: nebula-sync
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nebula-sync
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
