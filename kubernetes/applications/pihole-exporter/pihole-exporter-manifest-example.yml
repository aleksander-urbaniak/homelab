apiVersion: v1
kind: Namespace
metadata:
  name: pihole-exporter
  labels:
    app.kubernetes.io/name: pihole-exporter
---
apiVersion: v1
kind: Secret
metadata:
  name: pihole-exporter-secret
  namespace: pihole-exporter
type: Opaque
stringData:
  PIHOLE_PASSWORD: "REPLACE_ME"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pihole-exporter-certs
  namespace: pihole-exporter
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: longhorn
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pihole-exporter
  namespace: pihole-exporter
  labels:
    app.kubernetes.io/name: pihole-exporter
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pihole-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pihole-exporter
    spec:
      nodeSelector:
        node-role.kubernetes.io/worker: ""

      containers:
        - name: pihole-exporter
          image: ekofr/pihole-exporter:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 9617
          env:
            - name: PIHOLE_PROTOCOL
              value: "https"
            - name: PIHOLE_HOSTNAME
              value: "pihole-01.example.com,pihole-02.example.com,pihole-03.example.com"
            - name: PIHOLE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pihole-exporter-secret
                  key: PIHOLE_PASSWORD
            - name: PIHOLE_PORT
              value: "443"
            - name: PORT
              value: "9617"
          volumeMounts:
            - name: certs
              mountPath: /etc/ssl/certs
          command: ["./pihole-exporter"]
          args: ["-skip_tls_verification", "true"]
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: certs
          persistentVolumeClaim:
            claimName: pihole-exporter-certs
---
apiVersion: v1
kind: Service
metadata:
  name: pihole-exporter
  namespace: pihole-exporter
  labels:
    app.kubernetes.io/name: pihole-exporter
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pihole-exporter
  ports:
    - name: http-metrics
      port: 9617
      targetPort: metrics
      protocol: TCP
