apiVersion: v1
kind: Namespace
metadata:
  name: speedtest-tracker
---
apiVersion: v1
kind: Secret
metadata:
  name: speedtest-tracker-db-secret
  namespace: speedtest-tracker
  labels:
    app: speedtest-tracker-db
type: Opaque
data:
  POSTGRES_DB: "REPLACE_ME"
  POSTGRES_USER: "REPLACE_ME"
  POSTGRES_PASSWORD: "REPLACE_ME"
---
apiVersion: v1
kind: Service
metadata:
  name: speedtest-tracker-db-headless
  namespace: speedtest-tracker
  labels:
    app: speedtest-tracker-db
spec:
  clusterIP: None
  selector:
    app: speedtest-tracker-db
  ports:
    - name: postgres
      protocol: TCP
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: speedtest-tracker-db
  namespace: speedtest-tracker
  labels:
    app: speedtest-tracker-db
spec:
  serviceName: speedtest-tracker-db-headless
  replicas: 1
  selector:
    matchLabels:
      app: speedtest-tracker-db
  template:
    metadata:
      labels:
        app: speedtest-tracker-db
    spec:
      nodeSelector:
        node-role.kubernetes.io/worker: ""
      containers:
      - name: postgres
        image: postgres:18
        imagePullPolicy: IfNotPresent
        env:
          - name: POSTGRES_DB
            valueFrom:
              secretKeyRef:
                name: speedtest-tracker-db-secret
                key: POSTGRES_DB
          - name: POSTGRES_USER
            valueFrom:
              secretKeyRef:
                name: speedtest-tracker-db-secret
                key: POSTGRES_USER
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: speedtest-tracker-db-secret
                key: POSTGRES_PASSWORD
          - name: PGDATA
            value: /var/lib/postgresql/data/pgdata
        ports:
          - name: postgres
            containerPort: 5432
        volumeMounts:
          - name: data
            mountPath: /var/lib/postgresql/data
        readinessProbe:
          exec:
            command: ["sh","-c","pg_isready -d $POSTGRES_DB -U $POSTGRES_USER"]
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          exec:
            command: ["sh","-c","pg_isready -d $POSTGRES_DB -U $POSTGRES_USER"]
          initialDelaySeconds: 30
          periodSeconds: 30
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: longhorn
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 3Gi
---
apiVersion: v1
kind: Service
metadata:
  name: speedtest-tracker-db
  namespace: speedtest-tracker
  labels:
    app: speedtest-tracker-db
spec:
  type: ClusterIP
  selector:
    app: speedtest-tracker-db
  ports:
    - name: postgres
      protocol: TCP
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: speedtest-tracker-config
  namespace: speedtest-tracker
spec:
  storageClassName: longhorn
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: speedtest-tracker-web
  namespace: speedtest-tracker
spec:
  storageClassName: longhorn
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: speedtest-tracker
  namespace: speedtest-tracker
  labels:
    app: speedtest-tracker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: speedtest-tracker
  template:
    metadata:
      labels:
        app: speedtest-tracker
    spec:
      nodeSelector:
        node-role.kubernetes.io/worker: ""
      initContainers:
        - name: wait-for-db
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              until nc -z speedtest-tracker-db 5432; do
                echo "Waiting for Postgres...";
                sleep 3;
              done
      containers:
        - name: speedtest-tracker
          image: lscr.io/linuxserver/speedtest-tracker:1.13.5
          imagePullPolicy: IfNotPresent
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: DB_CONNECTION
              value: "pgsql"
            - name: DB_HOST
              value: "speedtest-tracker-db"
            - name: DB_PORT
              value: "5432"
            - name: DB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: speedtest-tracker-db-secret
                  key: POSTGRES_DB
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: speedtest-tracker-db-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: speedtest-tracker-db-secret
                  key: POSTGRES_PASSWORD
            - name: TZ
              value: "Europe/Warsaw"
            - name: CACHE_DRIVER
              value: "file"
            - name: SESSION_DRIVER
              value: "file"
            - name: SPEEDTEST_SCHEDULE
              value: "0 */3 * * *"
            - name: SPEEDTEST_SERVERS
              value: "22844,7202,23677,60356"
            - name: APP_KEY
              value: "REPLACE_ME"
          ports:
            - name: https
              containerPort: 443
          volumeMounts:
            - name: config
              mountPath: /config
            - name: web
              mountPath: /etc/ssl/web
          readinessProbe:
            tcpSocket:
              port: 443
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 443
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 300m
              memory: 512Mi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: speedtest-tracker-config
        - name: web
          persistentVolumeClaim:
            claimName: speedtest-tracker-web
---
apiVersion: v1
kind: Service
metadata:
  name: speedtest-tracker-app
  namespace: speedtest-tracker
  labels:
    app: speedtest-tracker
spec:
  type: ClusterIP
  selector:
    app: speedtest-tracker
  ports:
    - name: https
      protocol: TCP
      port: 443
      targetPort: 443
