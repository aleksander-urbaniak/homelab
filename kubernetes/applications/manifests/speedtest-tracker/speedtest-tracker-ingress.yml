apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: speedtest-tracker-ingress
  namespace: speedtest-tracker
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    nginx.ingress.kubernetes.io/auth-type: "basic"
    nginx.ingress.kubernetes.io/auth-secret: speedtest-tracker-basic-auth
    nginx.ingress.kubernetes.io/auth-realm: "Authentication Required"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - speedtest-tracker.example.com
      secretName: speedtest-tracker-tls
  rules:
    - host: speedtest-tracker.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: speedtest-tracker-app
                port:
                  number: 443
