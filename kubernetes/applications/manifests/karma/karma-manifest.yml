apiVersion: v1
kind: Namespace
metadata:
  name: karma
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: karma-config-pvc
  namespace: karma
spec:
  storageClassName: longhorn
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: karma-config
  namespace: karma
data:
  karma.yaml: |
    alertmanager:
      servers:
        - name: default
          uri: "http://alertmanager.alertmanager.svc.k3s.example.com:9093"
          proxy: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: karma
  namespace: karma
  labels:
    app: karma
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: karma
  template:
    metadata:
      labels:
        app: karma
    spec:
      nodeSelector:
        node-role.kubernetes.io/worker: ""
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      initContainers:
        - name: init-config
          image: busybox:1.37
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          command:
            - sh
            - -c
            - |
              cp -r /tmp-config/. /host-config/
              chown -R 65534:65534 /host-config
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: config-cm
              mountPath: /tmp-config
            - name: config-host
              mountPath: /host-config
      containers:
        - name: karma
          image: ghcr.io/prymitive/karma:v0.127
          imagePullPolicy: IfNotPresent
          env:
            - name: ALERTMANAGER_URI
              value: "http://alertmanager.alertmanager.svc.k3s.example.com:9093"
            - name: CONFIG_FILE
              value: /etc/karma/karma.yaml
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: config-host
              mountPath: /etc/karma
      volumes:
        - name: config-cm
          configMap:
            name: karma-config
        - name: config-host
          persistentVolumeClaim:
            claimName: karma-config-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: karma
  namespace: karma
spec:
  type: ClusterIP
  selector:
    app: karma
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: karma-ingress
  namespace: karma
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/auth-type: "basic"
    nginx.ingress.kubernetes.io/auth-secret: karma-basic-auth
    nginx.ingress.kubernetes.io/auth-realm: "Authentication Required"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - karma.example.com
      secretName: karma-tls
  rules:
    - host: karma.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: karma
                port:
                  number: 8080
