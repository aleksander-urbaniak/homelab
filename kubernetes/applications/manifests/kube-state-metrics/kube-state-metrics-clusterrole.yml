apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-state-metrics
rules:
  - apiGroups: [""]
    resources:
      - pods
      - services
      - endpoints
      - nodes
      - namespaces
    verbs: ["get", "list", "watch"]
  - apiGroups:
      - apps
      - batch
      - policy
      - autoscaling
      - storage.k8s.io
      - networking.k8s.io
    resources:
      - deployments
      - daemonsets
      - replicasets
      - statefulsets
      - jobs
      - cronjobs
      - poddisruptionbudgets
      - horizontalpodautoscalers
      - volumeattachments
      - storageclasses
      - ingresses
    verbs: ["get", "list", "watch"]
