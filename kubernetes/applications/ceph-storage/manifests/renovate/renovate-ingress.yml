---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: renovate-ingress
  namespace: renovate
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - renovate.example.com
  rules:
    - host: renovate.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: renovate
                port:
                  number: 80