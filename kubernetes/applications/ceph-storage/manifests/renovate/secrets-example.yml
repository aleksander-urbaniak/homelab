apiVersion: v1
kind: Secret
metadata:
  name: mend-renovate-env
  namespace: renovate
type: Opaque
stringData:
  # Required by Mend Renovate CE (fill from your ../env/mend-renovate.env)
  MEND_RNV_LICENSE_KEY: "REPLACE_ME"
  MEND_RNV_ACCEPT_TOS: "REPLACE_ME"

  # GitLab connection (CE-style)
  MEND_RNV_ENDPOINT: "REPLACE_ME"
  MEND_RNV_GITLAB_PAT: "REPLACE_ME"

  # API secret (name matches error message requirement)
  MEND_RNV_API_SERVER_SECRET: "REPLACE_ME"

  # Optional server config
  MEND_RNV_SERVER_PORT: "REPLACE_ME"
  # MEND_RNV_SERVER_HOSTNAME: "REPLACE_ME"

# =====================================
# Secrets - Git provider config (gitlab.env / github.env / etc.)
# Example: GitLab
# =====================================
---
apiVersion: v1
kind: Secret
metadata:
  name: renovate-gitlab-env
  namespace: renovate
type: Opaque
stringData:
  RENOVATE_PLATFORM: "REPLACE_ME"
  RENOVATE_ENDPOINT: "REPLACE_ME"
  RENOVATE_TOKEN: "REPLACE_ME"
  # Optional: "REPLACE_ME"
  RENOVATE_REPOSITORY_CACHE: "REPLACE_ME"

# =====================================
# PVCs (Ceph) for logs + SQLite DB
# =====================================
