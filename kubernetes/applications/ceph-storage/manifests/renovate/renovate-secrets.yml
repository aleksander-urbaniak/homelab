  # MEND_RNV_SERVER_HOSTNAME: "http://renovate-ce:8080"

# =====================================
# Secrets - Git provider config (gitlab.env / github.env / etc.)
# Example: GitLab
# =====================================
---
apiVersion: v1
kind: Secret
metadata:
  name: renovate-gitlab-env
  namespace: renovate
type: Opaque
stringData:
  RENOVATE_PLATFORM: "REPLACE_ME"
  RENOVATE_ENDPOINT: "REPLACE_ME"
  RENOVATE_TOKEN: "REPLACE_ME"
  # Optional: repo cache, same as RENOVATE_REPOSITORY_CACHE in compose
  RENOVATE_REPOSITORY_CACHE: "REPLACE_ME"
