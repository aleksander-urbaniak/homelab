
# =====================================
# 5. Service for Semaphore App
# =====================================
---
apiVersion: v1
kind: Service
metadata:
  name: semaphore-app
  namespace: semaphore
  labels:
    app: semaphore
spec:
  type: ClusterIP
  selector:
    app: semaphore
  ports:
  - name: http
    protocol: TCP
    port: 3000
    targetPort: 3000
