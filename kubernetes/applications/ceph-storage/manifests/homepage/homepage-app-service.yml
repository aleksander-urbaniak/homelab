
# =====================================
# 5. Service for Homepage (renamed)
# =====================================
---
apiVersion: v1
kind: Service
metadata:
  name: homepage-app
  namespace: homepage
  labels:
    app: homepage
spec:
  type: ClusterIP
  selector:
    app: homepage
  ports:
  - name: http
    protocol: TCP
    port: 3000
    targetPort: 3000
