apiVersion: v1
kind: Secret
metadata:
  name: affine-secrets
  namespace: affine
type: Opaque
stringData:
  # DB creds (URL-safe so DATABASE_URL won't break)
  DB_USERNAME: "REPLACE_ME"
  DB_PASSWORD: "REPLACE_ME"
  DB_DATABASE: "REPLACE_ME"

  # Redis auth
  REDIS_PASSWORD: "REPLACE_ME"

  # App env
  AFFINE_INDEXER_ENABLED: "REPLACE_ME"
  AFFINE_SERVER_EXTERNAL_URL: "REPLACE_ME"

  # Compose-style DB URL consumed by Affine + migration
  DATABASE_URL: "REPLACE_ME"

# =====================================
# PVCs (Ceph)
# =====================================
