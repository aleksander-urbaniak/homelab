apiVersion: v1
kind: Namespace
metadata:
  name: flarewatcher
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: flarewatcher-data-pvc
  namespace: flarewatcher
spec:
  storageClassName: longhorn
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: flarewatcher-env
  namespace: flarewatcher
type: Opaque
stringData:
  SECRET_ENCRYPTION_KEY: "REPLACE_ME"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flarewatcher
  namespace: flarewatcher
  labels:
    app: flarewatcher
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: flarewatcher
  template:
    metadata:
      labels:
        app: flarewatcher
    spec:
      securityContext:
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: init-data-permissions
          image: busybox:1.36
          command:
            - sh
            - -c
            - mkdir -p /app/data && chown -R 1001:1001 /app/data && chmod -R ug+rwX /app/data
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: data
              mountPath: /app/data
      containers:
        - name: flarewatcher
          image: aleksanderurbaniak/flarewatcher:v1.0.4
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: DATABASE_URL
              value: "file:/app/data/flarewatcher.db"
            - name: SECRET_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: flarewatcher-env
                  key: SECRET_ENCRYPTION_KEY
          securityContext:
            runAsUser: 1001
            runAsGroup: 1001
            runAsNonRoot: true
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "250m"
          readinessProbe:
            httpGet:
              path: /login
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /login
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: flarewatcher-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: flarewatcher
  namespace: flarewatcher
  labels:
    app: flarewatcher
spec:
  type: ClusterIP
  selector:
    app: flarewatcher
  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: 3000