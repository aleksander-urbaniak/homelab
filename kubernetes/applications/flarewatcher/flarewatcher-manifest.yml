apiVersion: v1
kind: Namespace
metadata:
  name: flarewatcher
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: flarewatcher-data-pvc
  namespace: flarewatcher
spec:
  storageClassName: longhorn
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: flarewatcher-env
  namespace: flarewatcher
type: Opaque
stringData:
  SECRET_ENCRYPTION_KEY: "REPLACE_ME"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flarewatcher
  namespace: flarewatcher
  labels:
    app: flarewatcher
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: flarewatcher
  template:
    metadata:
      labels:
        app: flarewatcher
    spec:
      containers:
        - name: flarewatcher
          image: aleksanderurbaniak/flarewatcher:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: DATABASE_URL
              value: "file:/app/data/flarewatcher.db"
            - name: SECRET_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: flarewatcher-env
                  key: SECRET_ENCRYPTION_KEY
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "250m"
          readinessProbe:
            httpGet:
              path: /login
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /login
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: flarewatcher-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: flarewatcher
  namespace: flarewatcher
  labels:
    app: flarewatcher
spec:
  type: ClusterIP
  selector:
    app: flarewatcher
  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flarewatcher-ingress
  namespace: flarewatcher
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/auth-type: "basic"
    nginx.ingress.kubernetes.io/auth-secret: flarewatcher-basic-auth
    nginx.ingress.kubernetes.io/auth-realm: "Authentication Required"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - flarewatcher.example.com
      secretName: flarewatcher-tls
  rules:
    - host: flarewatcher.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: flarewatcher
                port:
                  number: 3000
