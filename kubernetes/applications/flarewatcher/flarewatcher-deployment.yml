apiVersion: apps/v1
kind: Deployment
metadata:
  name: flarewatcher
  namespace: flarewatcher
  labels:
    app: flarewatcher
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: flarewatcher
  template:
    metadata:
      labels:
        app: flarewatcher
    spec:
      containers:
        - name: flarewatcher
          image: aleksanderurbaniak/flarewatcher:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: DATABASE_URL
              value: "file:/app/data/flarewatcher.db"
            - name: SECRET_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: flarewatcher-env
                  key: SECRET_ENCRYPTION_KEY
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "250m"
          readinessProbe:
            httpGet:
              path: /login
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /login
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: flarewatcher-data-pvc
