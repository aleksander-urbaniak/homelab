apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: alertmanager
  labels:
    app: alertmanager
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      nodeSelector:
        node-role.kubernetes.io/worker: ""
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      initContainers:
        - name: init-config
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              if [ ! -f /host-config/alertmanager.yml ]; then
                cp -r /tmp-config/. /host-config/
                chown -R 65534:65534 /host-config
              fi
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: config-cm
              mountPath: /tmp-config
            - name: config-host
              mountPath: /host-config
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.30.1
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/data
          ports:
            - name: web
              containerPort: 9093
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config-host
              mountPath: /etc/alertmanager
            - name: data
              mountPath: /data
      volumes:
        - name: config-cm
          configMap:
            name: alertmanager-config
        - name: config-host
          persistentVolumeClaim:
            claimName: alertmanager-config-pvc
        - name: data
          persistentVolumeClaim:
            claimName: alertmanager-data-pvc

