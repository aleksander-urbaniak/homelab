apiVersion: v1
kind: Namespace
metadata:
  name: affine

---
apiVersion: v1
kind: Secret
metadata:
  name: affine-secrets
  namespace: affine
type: Opaque
stringData:
  DB_USERNAME: "REPLACE_ME"
  DB_PASSWORD: "REPLACE_ME"
  DB_DATABASE: "affine"

  REDIS_PASSWORD: "REPLACE_ME"

  AFFINE_INDEXER_ENABLED: "false"
  AFFINE_SERVER_EXTERNAL_URL: "https://affine.example.com"

  DATABASE_URL: "REPLACE_ME"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: affine-config-pvc
  namespace: affine
spec:
  storageClassName: longhorn
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 512Mi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: affine-storage-pvc
  namespace: affine
spec:
  storageClassName: longhorn
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: affine-postgres
  namespace: affine
  labels:
    app: affine-postgres
spec:
  serviceName: affine-postgres
  replicas: 1
  selector:
    matchLabels:
      app: affine-postgres
  template:
    metadata:
      labels:
        app: affine-postgres
    spec:
      nodeSelector:
        node-role.kubernetes.io/worker: ""
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: "OnRootMismatch"
      initContainers:
        - name: init-pgdata
          image: busybox:1.37
          command: ["sh","-c","mkdir -p /var/lib/postgresql/data/pgdata && chown -R 999:999 /var/lib/postgresql/data"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: affine-secrets, key: DB_USERNAME } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: affine-secrets, key: DB_PASSWORD } }
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: affine-secrets, key: DB_DATABASE } }
            - name: POSTGRES_INITDB_ARGS
              value: "--data-checksums"
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
          readinessProbe:
            exec:
              command: ["sh","-c","pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\" -h 127.0.0.1 -p 5432"]
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["sh","-c","pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\" -h 127.0.0.1 -p 5432"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: longhorn
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi

---
apiVersion: v1
kind: Service
metadata:
  name: affine-postgres
  namespace: affine
spec:
  type: ClusterIP
  selector:
    app: affine-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: affine-redis
  namespace: affine
  labels:
    app: affine-redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: affine-redis
  template:
    metadata:
      labels:
        app: affine-redis
    spec:
      nodeSelector:
        node-role.kubernetes.io/worker: ""
      containers:
        - name: redis
          image: redis:8
          args:
            - sh
            - -c
            - |
              redis-server --appendonly yes --requirepass "$REDIS_PASSWORD"
          env:
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: affine-secrets, key: REDIS_PASSWORD } }
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["sh","-c","redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh","-c","redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: affine-redis
  namespace: affine
spec:
  type: ClusterIP
  selector:
    app: affine-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379

---
apiVersion: batch/v1
kind: Job
metadata:
  name: affine-migration
  namespace: affine
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: affine-migration
    spec:
      nodeSelector:
        node-role.kubernetes.io/worker: ""
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: postgres:18
          env:
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: affine-secrets, key: DB_PASSWORD } }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: affine-secrets, key: DB_USERNAME } }
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: affine-secrets, key: DB_DATABASE } }
          command:
            - sh
            - -c
            - |
              until pg_isready -h affine-postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do
                sleep 2
              done
        - name: wait-for-redis
          image: redis:8
          env:
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: affine-secrets, key: REDIS_PASSWORD } }
          command:
            - sh
            - -c
            - |
              until redis-cli -h affine-redis -a "$REDIS_PASSWORD" ping | grep -q PONG; do
                sleep 2
              done
      containers:
        - name: migration
          image: ghcr.io/toeverything/affine:stable
          command: ["sh","-c","node ./scripts/self-host-predeploy.js"]
          env:
            - name: REDIS_SERVER_HOST
              value: affine-redis
            - name: REDIS_SERVER_PORT
              value: "6379"
            - name: REDIS_SERVER_PASSWORD
              valueFrom: { secretKeyRef: { name: affine-secrets, key: REDIS_PASSWORD } }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: affine-secrets, key: DATABASE_URL } }
            - name: AFFINE_INDEXER_ENABLED
              valueFrom: { secretKeyRef: { name: affine-secrets, key: AFFINE_INDEXER_ENABLED } }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: affine
  namespace: affine
  labels:
    app: affine
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: affine
  template:
    metadata:
      labels:
        app: affine
    spec:
      nodeSelector:
        node-role.kubernetes.io/worker: ""
      containers:
        - name: affine
          image: ghcr.io/toeverything/affine:stable
          ports:
            - name: http
              containerPort: 3010
          env:
            - name: REDIS_SERVER_HOST
              value: affine-redis
            - name: REDIS_SERVER_PORT
              value: "6379"
            - name: REDIS_SERVER_PASSWORD
              valueFrom: { secretKeyRef: { name: affine-secrets, key: REDIS_PASSWORD } }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: affine-secrets, key: DATABASE_URL } }
            - name: AFFINE_INDEXER_ENABLED
              valueFrom: { secretKeyRef: { name: affine-secrets, key: AFFINE_INDEXER_ENABLED } }
            - name: AFFINE_SERVER_EXTERNAL_URL
              valueFrom: { secretKeyRef: { name: affine-secrets, key: AFFINE_SERVER_EXTERNAL_URL } }
          volumeMounts:
            - name: affine-storage
              mountPath: /root/.affine/storage
            - name: affine-config
              mountPath: /root/.affine/config
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3010
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3010
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
      volumes:
        - name: affine-storage
          persistentVolumeClaim:
            claimName: affine-storage-pvc
        - name: affine-config
          persistentVolumeClaim:
            claimName: affine-config-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: affine
  namespace: affine
spec:
  type: ClusterIP
  selector:
    app: affine
  ports:
    - name: http
      port: 3010
      targetPort: 3010
