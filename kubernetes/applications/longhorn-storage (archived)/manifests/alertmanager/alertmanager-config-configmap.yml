apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: alertmanager
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    route:
      group_by: ['alertname','instance']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 9999h
      receiver: 'discord'

    receivers:
      - name: 'discord'
        discord_configs:
          - webhook_url: 'REPLACE_ME'

