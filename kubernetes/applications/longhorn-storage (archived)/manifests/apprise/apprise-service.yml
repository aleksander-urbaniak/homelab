apiVersion: v1
kind: Service
metadata:
  name: apprise
  namespace: apprise
  labels:
    app: apprise
spec:
  type: ClusterIP
  selector:
    app: apprise
  ports:
  - name: http
    protocol: TCP
    port: 8000
    targetPort: 8000

