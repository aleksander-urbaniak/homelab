apiVersion: v1
kind: Namespace
metadata:
  name: authentik
---
apiVersion: v1
kind: Secret
metadata:
  name: authentik-secrets
  namespace: authentik
type: Opaque
stringData:
  secret_key: "REPLACE_ME"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: authentik-postgres-db
  namespace: authentik
  labels:
    app: authentik-postgres-db
spec:
  serviceName: authentik-postgres-db
  replicas: 1
  selector:
    matchLabels:
      app: authentik-postgres-db
  template:
    metadata:
      labels:
        app: authentik-postgres-db
    spec:
      nodeSelector:
        node-role.kubernetes.io/worker: ""
      containers:
        - name: postgres
          image: postgres:18
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              value: "REPLACE_ME"
            - name: POSTGRES_DB
              value: "authentik"
            - name: POSTGRES_PASSWORD
              value: "REPLACE_ME"
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["sh","-c","pg_isready -d authentik -U authentik"]
            initialDelaySeconds: 20
            periodSeconds: 30
          livenessProbe:
            exec:
              command: ["sh","-c","pg_isready -d authentik -U authentik"]
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: longhorn
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: authentik-postgres-db
  namespace: authentik
spec:
  selector:
    app: authentik-postgres-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: authentik-redis-app
  namespace: authentik
  labels:
    app: authentik-redis-app
spec:
  serviceName: authentik-redis-app
  replicas: 1
  selector:
    matchLabels:
      app: authentik-redis-app
  template:
    metadata:
      labels:
        app: authentik-redis-app
    spec:
      nodeSelector:
        node-role.kubernetes.io/worker: ""
      containers:
        - name: redis
          image: redis:alpine
          imagePullPolicy: IfNotPresent
          command: ["redis-server","--save","60","1","--appendonly","no"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli","ping"]
            initialDelaySeconds: 20
            periodSeconds: 30
          livenessProbe:
            exec:
              command: ["redis-cli","ping"]
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: longhorn
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: authentik-redis-app
  namespace: authentik
spec:
  selector:
    app: authentik-redis-app
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: authentik-media-pvc
  namespace: authentik
spec:
  storageClassName: longhorn
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: authentik-templates-pvc
  namespace: authentik
spec:
  storageClassName: longhorn
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: authentik-certs-pvc
  namespace: authentik
spec:
  storageClassName: longhorn
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-server-app
  namespace: authentik
  labels:
    app: authentik-server-app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: authentik-server-app
  template:
    metadata:
      labels:
        app: authentik-server-app
    spec:
      nodeSelector:
        node-role.kubernetes.io/worker: ""
      initContainers:
        - name: fix-permissions
          image: busybox:1.37
          command: ["sh","-c","chmod -R 777 /media /templates /certs"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: media
              mountPath: /media
            - name: templates
              mountPath: /templates
            - name: certs
              mountPath: /certs
        - name: wait-for-postgres
          image: postgres:18
          command:
            - sh
            - -c
            - |
              until pg_isready -h authentik-postgres-db -U authentik; do
                echo "Waiting for Postgres…"; sleep 5;
              done
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
        - name: wait-for-redis
          image: redis:alpine
          command:
            - sh
            - -c
            - |
              until redis-cli -h authentik-redis-app ping | grep PONG; do
                echo "Waiting for Redis…"; sleep 5;
              done
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
      containers:
        - name: authentik-server-app
          image: ghcr.io/goauthentik/server:2026.2.2
          imagePullPolicy: IfNotPresent
          args: ["server"]
          env:
            - name: AUTHENTIK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: authentik-secrets
                  key: secret_key
            - name: AUTHENTIK_REDIS__HOST
              value: "authentik-redis-app"
            - name: AUTHENTIK_REDIS__PORT
              value: "6379"
            - name: AUTHENTIK_POSTGRESQL__HOST
              value: "authentik-postgres-db"
            - name: AUTHENTIK_POSTGRESQL__PORT
              value: "5432"
            - name: AUTHENTIK_POSTGRESQL__USER
              value: "REPLACE_ME"
            - name: AUTHENTIK_POSTGRESQL__NAME
              value: "authentik"
            - name: AUTHENTIK_POSTGRESQL__PASSWORD
              value: "REPLACE_ME"
            - name: AUTHENTIK_LISTEN__HTTP
              value: "0.0.0.0:80"
            - name: AUTHENTIK_LISTEN__HTTPS
              value: "0.0.0.0:443"
          ports:
            - name: http
              containerPort: 80
            - name: https
              containerPort: 443
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 2Gi
          volumeMounts:
            - name: media
              mountPath: /media
            - name: templates
              mountPath: /templates
            - name: certs
              mountPath: /certs
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: authentik-media-pvc
        - name: templates
          persistentVolumeClaim:
            claimName: authentik-templates-pvc
        - name: certs
          persistentVolumeClaim:
            claimName: authentik-certs-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: authentik-server-app
  namespace: authentik
spec:
  selector:
    app: authentik-server-app
  ports:
    - name: http
      port: 80
      targetPort: 80
    - name: https
      port: 443
      targetPort: 443
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-worker
  namespace: authentik
  labels:
    app: authentik-worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: authentik-worker
  template:
    metadata:
      labels:
        app: authentik-worker
    spec:
      nodeSelector:
        node-role.kubernetes.io/worker: ""
      initContainers:
        - name: fix-permissions
          image: busybox:1.37
          command: ["sh","-c","chmod -R 777 /media /templates /certs"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: media
              mountPath: /media
            - name: templates
              mountPath: /templates
            - name: certs
              mountPath: /certs
        - name: wait-for-postgres
          image: postgres:18
          command:
            - sh
            - -c
            - |
              until pg_isready -h authentik-postgres-db -U authentik; do
                echo "Waiting for Postgres…"; sleep 5;
              done
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
        - name: wait-for-redis
          image: redis:alpine
          command:
            - sh
            - -c
            - |
              until redis-cli -h authentik-redis-app ping | grep PONG; do
                echo "Waiting for Redis…"; sleep 5;
              done
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
      containers:
        - name: authentik-worker
          image: ghcr.io/goauthentik/server:2026.2.2
          imagePullPolicy: IfNotPresent
          args: ["worker"]
          env:
            - name: AUTHENTIK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: authentik-secrets
                  key: secret_key
            - name: AUTHENTIK_REDIS__HOST
              value: "authentik-redis-app"
            - name: AUTHENTIK_REDIS__PORT
              value: "6379"
            - name: AUTHENTIK_POSTGRESQL__HOST
              value: "authentik-postgres-db"
            - name: AUTHENTIK_POSTGRESQL__PORT
              value: "5432"
            - name: AUTHENTIK_POSTGRESQL__USER
              value: "REPLACE_ME"
            - name: AUTHENTIK_POSTGRESQL__NAME
              value: "authentik"
            - name: AUTHENTIK_POSTGRESQL__PASSWORD
              value: "REPLACE_ME"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 2Gi
          volumeMounts:
            - name: media
              mountPath: /media
            - name: templates
              mountPath: /templates
            - name: certs
              mountPath: /certs
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: authentik-media-pvc
        - name: templates
          persistentVolumeClaim:
            claimName: authentik-templates-pvc
        - name: certs
          persistentVolumeClaim:
            claimName: authentik-certs-pvc
---
apiVersion: v1
kind: Secret
metadata:
  name: ak-ldap-outpost-secret
  namespace: authentik
type: Opaque
stringData:
  AUTHENTIK_HOST: "http://authentik-server-app"
  AUTHENTIK_INSECURE: "true"
  AUTHENTIK_TOKEN: "REPLACE_ME"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ak-ldap-outpost
  namespace: authentik
  labels:
    app: ak-ldap-outpost
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ak-ldap-outpost
  template:
    metadata:
      labels:
        app: ak-ldap-outpost
    spec:
      nodeSelector:
        node-role.kubernetes.io/worker: ""
      containers:
        - name: ldap
          image: ghcr.io/goauthentik/ldap:2026.2.2
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: ak-ldap-outpost-secret
          ports:
            - name: ldap-internal
              containerPort: 3389
              protocol: TCP
            - name: ldaps-internal
              containerPort: 6636
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: 3389
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ak-ldap-outpost
  namespace: authentik
spec:
  type: ClusterIP
  selector:
    app: ak-ldap-outpost
  ports:
    - name: ldap
      port: 389
      targetPort: 3389
      protocol: TCP
    - name: ldaps
      port: 636
      targetPort: 6636
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: authentik-ingress
  namespace: authentik
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/auth-type: "basic"
    nginx.ingress.kubernetes.io/auth-secret: authentik-basic-auth
    nginx.ingress.kubernetes.io/auth-realm: "Authentication Required"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - authentik.example.com
      secretName: authentik-tls
  rules:
    - host: authentik.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: authentik-server-app
                port:
                  number: 80
