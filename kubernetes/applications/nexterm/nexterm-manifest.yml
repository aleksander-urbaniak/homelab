apiVersion: v1
kind: Namespace
metadata:
  name: nexterm
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nexterm-data-pvc
  namespace: nexterm
spec:
  storageClassName: longhorn
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: nexterm-env
  namespace: nexterm
type: Opaque
stringData:
  NEXTERM_ENCRYPTION_KEY: "REPLACE_ME"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexterm
  namespace: nexterm
  labels:
    app: nexterm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nexterm
  template:
    metadata:
      labels:
        app: nexterm
    spec:
      containers:
        - name: nexterm
          image: germannewsmaker/nexterm:1.2.0-BETA
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 6989
          env:
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: nexterm-env
                  key: NEXTERM_ENCRYPTION_KEY
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            tcpSocket:
              port: 6989
            initialDelaySeconds: 15
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: 6989
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "250m"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nexterm-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: nexterm
  namespace: nexterm
  labels:
    app: nexterm
spec:
  type: ClusterIP
  selector:
    app: nexterm
  ports:
    - name: http
      protocol: TCP
      port: 6989
      targetPort: 6989
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexterm-ingress
  namespace: nexterm
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/auth-type: "basic"
    nginx.ingress.kubernetes.io/auth-secret: nexterm-basic-auth
    nginx.ingress.kubernetes.io/auth-realm: "Authentication Required"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - nexterm.example.com
      secretName: nexterm-tls
  rules:
    - host: nexterm.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nexterm
                port:
                  number: 6989
